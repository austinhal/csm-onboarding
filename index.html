<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #faf8f3; }
  body { font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif; color: #15202b; -webkit-font-smoothing: antialiased; }
  input, textarea, button { font-family: inherit; }
  button { -webkit-appearance: none; }
  textarea { font-family: Inter, sans-serif; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }
  ::selection { background: #2563eb; color: #fff; }
  .header-inner { padding: 28px 32px 36px; }
  .content-wrap  { padding: 32px; }
  @media (max-width: 600px) {
    .header-inner { padding: 20px 16px 24px; }
    .content-wrap  { padding: 16px; }
  }
</style>
